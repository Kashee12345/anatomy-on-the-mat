<line x1="290" y1="324" x2="380" y2="315" stroke="#9A5B06" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="290" y1="366" x2="380" y2="425" stroke="#9A5B06" stroke-width="1.5" stroke-dasharray="5 4"/>
