<line x1="460" y1="367" x2="466" y2="361"/><line x1="475" y1="367" x2="481" y2="361"/><line x1="490" y1="367" x2="496" y2="361"/><line x1="570" y1="367" x2="564" y2="361"/><line x1="585" y1="367" x2="579" y2="361"/><line x1="600" y1="367" x2="594" y2="361"/>
<line x1="460" y1="397" x2="466" y2="391"/><line x1="475" y1="397" x2="481" y2="391"/><line x1="490" y1="397" x2="496" y2="391"/><line x1="570" y1="397" x2="564" y2="391"/><line x1="585" y1="397" x2="579" y2="391"/><line x1="600" y1="397" x2="594" y2="391"/>
</g>
<line x1="380" y1="315" x2="380" y2="429" stroke="#16303A" stroke-width="5"/>
