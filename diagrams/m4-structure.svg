<ellipse cx="700" cy="177" rx="9" ry="4" fill="#16303A"/>
<text x="647" y="240" font-size="20" font-weight="bold" fill="#16303A" text-anchor="middle">Muscle fiber</text>
<text x="647" y="263" font-size="18" fill="#55707A" text-anchor="middle">one long cell</text>
<!-- 4 Myofibril -->
<line x1="40" y1="298" x2="760" y2="298" stroke="#C6D4CF" stroke-width="2"/>
<rect x="50" y="330" width="240" height="30" rx="6" fill="#F3D9DE" stroke="#B3304C" stroke-width="2"/>
