<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, Helvetica, sans-serif">
<rect width="800" height="500" fill="#F9FBFA"/>
<text x="400" y="48" font-size="26" font-weight="bold" fill="#16303A" text-anchor="middle">From whole muscle to sarcomere</text>
<!-- 1 Muscle -->
<rect x="30" y="154" width="36" height="12" rx="4" fill="#F1EADA" stroke="#CBB78C" stroke-width="2"/>
<rect x="194" y="154" width="36" height="12" rx="4" fill="#F1EADA" stroke="#CBB78C" stroke-width="2"/>
<path d="M62,160 C95,100 165,100 198,160 C165,220 95,220 62,160 Z" fill="#F3D9DE" stroke="#B3304C" stroke-width="3"/>
<path d="M80,160 C110,128 150,128 180,160" fill="none" stroke="#B3304C" stroke-width="1.5" opacity="0.5"/>
<path d="M80,160 C110,192 150,192 180,160" fill="none" stroke="#B3304C" stroke-width="1.5" opacity="0.5"/>
<line x1="72" y1="160" x2="188" y2="160" stroke="#B3304C" stroke-width="1.5" opacity="0.5"/>
<text x="130" y="240" font-size="20" font-weight="bold" fill="#16303A" text-anchor="middle">Muscle</text>
<text x="130" y="263" font-size="18" fill="#55707A" text-anchor="middle">whole organ</text>
<!-- arrow -->
<line x1="244" y1="160" x2="276" y2="160" stroke="#55707A" stroke-width="3"/>
<polygon points="286,160 274,152 274,168" fill="#55707A"/>
<!-- 2 Fascicle -->
<rect x="302" y="122" width="156" height="76" rx="30" fill="#F3D9DE" stroke="#B3304C" stroke-width="3"/>
<g fill="#FFFFFF" stroke="#B3304C" stroke-width="1.5">
<rect x="318" y="132" width="124" height="14" rx="7"/>
<rect x="318" y="149" width="124" height="14" rx="7"/>
<rect x="318" y="166" width="124" height="14" rx="7"/>
<rect x="330" y="183" width="100" height="8" rx="4"/>
</g>
<text x="380" y="240" font-size="20" font-weight="bold" fill="#16303A" text-anchor="middle">Fascicle</text>
<text x="380" y="263" font-size="18" fill="#55707A" text-anchor="middle">bundle of fibers</text>
<!-- arrow -->
<line x1="476" y1="160" x2="508" y2="160" stroke="#55707A" stroke-width="3"/>
<polygon points="518,160 506,152 506,168" fill="#55707A"/>
